name: Auto PR -> main (requiere palabra PR)

on:
  push:
    branches: ["dev", "DEV"]   # escucha ambas variantes
  workflow_dispatch: {}        # permite correrlo manualmente

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Debug ref
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"

      - name: Gate por mensaje que contenga la palabra exacta PR
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const commits = context.payload.commits || [];
            const hit = commits.some(c => /\bPR\b/.test(c.message)); // sensible a mayúsculas
            core.setOutput('open', hit ? 'true' : 'false');
            core.info(`Gate (tiene PR?): ${hit}`);

      - name: Crear PR hacia main si pasa el gate
        if: steps.gate.outputs.open == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const base = "main";
            // rama actual del push (p.ej., "DEV" o "dev")
            const head = context.ref.replace('refs/heads/', '');
            core.info(`Base=${base}  Head=${head}`);

            if (head.toLowerCase() === base.toLowerCase()) {
              core.notice("Estás en main; no tiene sentido abrir PR.");
              return;
            }

            // ¿Ya existe un PR abierto head->base?
            const existing = await github.rest.pulls.list({
              owner, repo, state: "open", base, head: `${owner}:${head}`
            });
            if (existing.data.length > 0) {
              core.notice(`PR ya existe: ${existing.data[0].html_url}`);
              return;
            }

            // Asegura que head esté por delante de base
            const cmp = await github.rest.repos.compareCommits({ owner, repo, base, head });
            const ahead = cmp.data.ahead_by || 0;
            if (ahead <= 0) {
              core.notice(`${head} no está por delante de ${base}; no se crea PR.`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner, repo, base, head,
              title: `Promote ${head} -> ${base} (${ahead} commit${ahead===1?"":"s"})`,
              body: "PR automático: se detectó la palabra exacta `PR` en un commit de este push."
            });

            core.notice(`PR creado: ${pr.data.html_url}`);
