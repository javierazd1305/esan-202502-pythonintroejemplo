name: copy-main-to-databricks

on:
  pull_request:
    types: [closed]     # solo cuando se cierra la PR
    branches: [main]    # y la base es main
  workflow_dispatch: {} # opción de lanzarlo manualmente

permissions:
  contents: read

jobs:
  copy:
    # corre SOLO si la PR fue MERGEADA (no cerrada sin merge)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      # Secrets necesarios (Configúralos en: Settings → Secrets and variables → Actions)
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # Parametrización
      PROJ: tu-proyecto                             # nombre lógico del proyecto
      # Ruta destino en el Workspace (prod). Mantén el formato que ya te funciona.
      TARGET_SUBPATH: /Shared/projects/${PROJ}/prod

      # (Opcional) Restringir a merges que vengan de dev/DEV solamente:
      ONLY_FROM_DEV: "false"   # pon "true" si quieres limitarlo

    steps:
      - name: Validar origen (opcional)
        if: env.ONLY_FROM_DEV == 'true'
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          if [ "$HEAD_REF" != "dev" ] && [ "$HEAD_REF" != "DEV" ]; then
            echo "Merge viene de $HEAD_REF y ONLY_FROM_DEV=true. Saliendo sin hacer deploy."
            exit 0
          fi

      - name: Checkout main (último estado tras el merge)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Instala el CLI unificado de Databricks (usa el mismo action que ya te funcionó)
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Smoke básico
        run: |
          databricks --version
          databricks current-user me || true
          databricks workspace list / || true

      - name: Resolver ruta destino
        id: target
        run: |
          echo "dir=${TARGET_SUBPATH}" >> $GITHUB_OUTPUT
          echo "Destino: ${TARGET_SUBPATH}"

      # (Opcional) limpiar destino para evitar archivos huérfanos
      # Si prefieres no borrar, elimina este paso.
      - name: Limpiar destino (opcional)
        run: |
          databricks workspace delete -r "${{ steps.target.outputs.dir }}" || true
          databricks workspace mkdirs "${{ steps.target.outputs.dir }}"

      # Importar TODO el repo (archivos soportados: .ipynb, .py, .sql, .scala, etc.)
      # --exclude-hidden evita subir .github/ y otros dotfiles
      - name: Importar repo a Databricks (prod)
        run: |
          databricks workspace import-dir \
            --exclude-hidden \
            --overwrite \
            . "${{ steps.target.outputs.dir }}"

      - name: Ver contenido final
        run: |
          databricks workspace list "${{ steps.target.outputs.dir }}"
